name: agroshare
description: "o AgroShare é um aplicativo voltado para produtores ruais de um mesma região alugarem, emprestarem e trocarem máquinas, implementos e ferramentas agrícolas ociosas."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_auth_platform_interface: ^9.1.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  google_fonts: ^8.2.1
  flutter_email_sender: ^10.0.1
  provider: ^6.1.5+1
  iconsx_plus: ^1.0.1
  flutter_launcher_icons: ^0.14.4
  firebase_core: ^4.15.0
  mask_text_input_formatter: ^2.9.0
  image_picker: ^1.2.3
  shimmer: ^4.0.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.2
  dotted_border: ^3.1.0
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  currency_text_input_formatter: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#4b9068"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

